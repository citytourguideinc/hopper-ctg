<script>function legalText(box){if(!box)return'';const c=box.cloneNode(true);const first=c.firstElementChild;if(first&&(/Scroll to read full release|Read all/.test(first.textContent||'')))first.remove();return[...c.querySelectorAll('h2,p,li')].map(el=>(el.textContent||'').trim()).filter(Boolean).join('\n\n')}function safeFile(v){return String(v||'participant').trim().replace(/[^a-zA-Z0-9._-]+/g,'_').replace(/^_+|_+$/g,'')||'participant'}function makeSignedPdf(data){if(!window.jspdf?.jsPDF)throw new Error('PDF component unavailable. Please refresh and try again.');const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'letter'}),margin=16,width=184;let y=18;function page(){doc.addPage();y=18}function write(text,size=9,bold=false,gap=4){doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);const lines=doc.splitTextToSize(String(text||''),width);for(const line of lines){if(y>260)page();doc.text(line,margin,y);y+=size*0.38+1.6}y+=gap}doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('City Tour Guide Inc',105,y,{align:'center'});y+=7;doc.setFontSize(12);doc.text('2026 Liability Release',105,y,{align:'center'});y+=9;write(`Ride Date: ${data.ride_date}    Start Time: ${data.start_time}`,10,true,5);write(legalText(adultLegal),9,false,6);if(data.waiver_type==='adult_with_minors')write(legalText(minorLegal),9,false,6);if(y>190)page();write('SIGNATURE CERTIFICATION',11,true,4);write(`Participant / Parent or Legal Guardian: ${data.print_name}`,10,true,2);write(`DOB: ${data.dob}    Phone: ${data.phone||''}`,9,false,2);write(`Address: ${data.address||''}, ${data.city||''}, ${data.state||''} ${data.zip||''}`,9,false,2);write(`Email: ${data.email||''}`,9,false,2);if(data.minors?.length){write('Minor Child/Children:',9,true,1);data.minors.forEach((m,i)=>write(`${i+1}. ${m.name} | Birthdate: ${m.birthdate} | Relation: ${m.relation||''}`,9,false,1))}write(`Electronically signed: ${new Date().toLocaleString()}`,9,false,2);write(`Waiver Token: ${data.token}`,8,false,3);if(y>220)page();try{doc.addImage(data.signature_data,'PNG',margin,y,85,28);y+=33}catch(e){}doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text('Electronic signature captured through the City Tour Guide Inc waiver system.',margin,y);const blob=doc.output('blob'),base64=doc.output('datauristring').split(',')[1],filename=`CTG_Waiver_${safeFile(data.ride_date)}_${safeFile(data.start_time)}_${safeFile(data.print_name)}.pdf`;return{blob,base64,filename}}async function submitWaiver(){const err=document.getElementById('err'),btn=document.getElementById('submit'),name=document.getElementById('name').value.trim(),dob=document.getElementById('dob').value,rideDate=document.getElementById('ride_date').value,startTime=document.getElementById('start_time').value;if(!rideDate||!startTime){err.textContent='Ride Date and Start Time are required.';return}if(!name||!dob){err.textContent='Print Name and DOB are required.';return}if(!marked){err.textContent='Signature is required.';return}if(!document.getElementById('confirm').checked){err.textContent='Please confirm that you read and agree to the release.';return}const wt=document.getElementById('type').value,minors=[];if(wt==='adult_with_minors'){for(let i=1;i<=4;i++){const n=document.getElementById('mn'+i).value.trim(),b=document.getElementById('mb'+i).value,r=document.getElementById('mr'+i).value.trim();if(n||b||r){if(!n||!b){err.textContent='Each listed minor requires a name and birthdate.';return}minors.push({name:n,birthdate:b,relation:r})}}if(!minors.length){err.textContent='Add at least one minor child.';return}}const parts=location.pathname.split('/').filter(Boolean),token=parts[parts.length-1],signature=document.getElementById('sig').toDataURL('image/png');const payload={waiver_type:wt,print_name:name,dob,phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim(),address:document.getElementById('address').value.trim(),city:document.getElementById('city').value.trim(),state:document.getElementById('state').value.trim(),zip:document.getElementById('zip').value.trim(),signature_data:signature,token,minors,minor_count:minors.length,marketing_opt_in:false,referral_source:'Prime Insurance 2026 release',ride_date:rideDate,start_time:startTime};let pdf;try{pdf=makeSignedPdf(payload)}catch(e){err.textContent=e.message;return}btn.disabled=true;btn.textContent='Submitting...';try{const resp=await fetch('/api/hopper-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await resp.json();if(!resp.ok||!data.success)throw new Error(data.error||'Submission failed');btn.textContent='Storing signed PDF...';const pdfResp=await fetch('/api/hopper-waiver-pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,ride_date:rideDate,start_time:startTime,print_name:name,pdf_base64:pdf.base64,request_id:data.request_id||null})}),pdfData=await pdfResp.json();if(!pdfResp.ok||!pdfData.success)throw new Error('Waiver was signed, but PDF storage failed: '+(pdfData.error||'unknown error'));clearDraft();const url=URL.createObjectURL(pdf.blob);document.body.innerHTML=`<div style="font-family:Arial,sans-serif;text-align:center;padding:60px 20px"><h2>Waiver Submitted</h2><p>Your signed 2026 City Tour Guide Inc liability release has been recorded and stored with your ride group.</p><p><b>Ride:</b> ${rideDate} at ${startTime}</p><p><a href="${url}" download="${pdf.filename}" style="display:inline-block;padding:12px 18px;background:#111827;color:#fff;text-decoration:none;border-radius:8px;font-weight:bold">Download Signed PDF</a></p></div>`}catch(e){err.textContent=e.message||'Unable to submit waiver.';btn.disabled=false;btn.textContent='Submit Waiver'}}</script></body></html>
