<script>let marked=false,ctx,down=false,last={x:0,y:0};function mode(){const minors=document.getElementById('type').value==='adult_with_minors';document.getElementById('minorBlock').style.display=minors?'block':'none';document.getElementById('minorFields').style.display=minors?'block':'none';if(minors&&!document.getElementById('children').children.length){let h='';for(let i=1;i<=4;i++)h+=`<div class="m"><b>MINOR NAME #${i}</b><div class="f"><label>First name, Last name</label><input id="mn${i}"></div><div class="r"><div class="f"><label>BIRTHDATE</label><input id="mb${i}" type="date"></div><div class="f"><label>RELATION</label><input id="mr${i}"></div></div></div>`;document.getElementById('children').innerHTML=h}}function fit(){const c=document.getElementById('sig'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx=c.getContext('2d');ctx.scale(d,d);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#111'}function pos(e){const c=document.getElementById('sig'),r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function start(e){e.preventDefault();down=true;marked=true;last=pos(e)}function move(e){if(!down)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function stop(){down=false}function clearSig(){fit();marked=false}document.addEventListener('DOMContentLoaded',()=>{fit();const c=document.getElementById('sig');c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);c.addEventListener('mouseup',stop);c.addEventListener('mouseleave',stop);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',stop);document.getElementById('name').addEventListener('input',e=>{document.getElementById('guardianMirror').textContent=e.target.value;document.getElementById('guardianNameLine').textContent=e.target.value||'______________________________'});mode()});</script>
