<script>let marked=false,ctx,down=false,last={x:0,y:0},adultRead=false,minorRead=false,adultLegal=null,minorLegal=null;function setReadState(box,status,done){if(!box||!status)return;status.textContent=done?'✓ Read all':'Scroll to read full release';status.style.background=done?'#e8f7ed':'#fdecec';status.style.color=done?'#146c2e':'#a11a1a';status.style.borderColor=done?'#98d7aa':'#e5a2a2'}function refreshAgreement(){const minors=document.getElementById('type').value==='adult_with_minors',ok=adultRead&&(!minors||minorRead),cb=document.getElementById('confirm'),txt=document.getElementById('confirmText');cb.disabled=!ok;if(!ok)cb.checked=false;txt.textContent=ok?'I have read the applicable release above and agree to its conditions.':'Scroll through the full release above to confirm you have read it.'}function watchLegal(box,which){if(!box)return;box.style.maxHeight='50vh';box.style.overflowY='auto';box.style.position='relative';box.style.scrollBehavior='smooth';const status=document.createElement('div');status.style.cssText='position:sticky;top:0;z-index:2;margin:-4px -4px 10px;padding:7px 10px;border:1px solid #e5a2a2;border-radius:6px;background:#fdecec;color:#a11a1a;font-size:12px;font-weight:bold;text-align:center';status.textContent='Scroll to read full release';box.insertBefore(status,box.firstChild);box.addEventListener('scroll',()=>{const reached=box.scrollTop+box.clientHeight>=box.scrollHeight-8;if(reached){if(which==='adult')adultRead=true;else minorRead=true;setReadState(box,status,true);refreshAgreement()}});if(box.scrollHeight<=box.clientHeight+8){if(which==='adult')adultRead=true;else minorRead=true;setReadState(box,status,true)}}function mode(){const minors=document.getElementById('type').value==='adult_with_minors';document.getElementById('minorBlock').style.display=minors?'block':'none';document.getElementById('minorFields').style.display=minors?'block':'none';if(minors&&!document.getElementById('children').children.length){let h='';for(let i=1;i<=4;i++)h+=`<div class="m"><b>MINOR NAME #${i}</b><div class="f"><label>First name, Last name</label><input id="mn${i}"></div><div class="r"><div class="f"><label>BIRTHDATE</label><input id="mb${i}" type="date"></div><div class="f"><label>RELATION</label><input id="mr${i}"></div></div></div>`;document.getElementById('children').innerHTML=h}refreshAgreement()}function fit(){const c=document.getElementById('sig'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx=c.getContext('2d');ctx.scale(d,d);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#111'}function pos(e){const c=document.getElementById('sig'),r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function start(e){e.preventDefault();down=true;marked=true;last=pos(e)}function move(e){if(!down)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function stop(){down=false}function clearSig(){fit();marked=false}document.addEventListener('DOMContentLoaded',()=>{fit();const c=document.getElementById('sig');c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);c.addEventListener('mouseup',stop);c.addEventListener('mouseleave',stop);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',stop);document.getElementById('name').addEventListener('input',e=>{document.getElementById('guardianMirror').textContent=e.target.value;document.getElementById('guardianNameLine').textContent=e.target.value||'______________________________'});const heading=[...document.querySelectorAll('h2')].find(h=>h.textContent.trim()==='PARTICIPANT AGREEMENT, RELEASE AND ASSUMPTION OF RISK');adultLegal=heading?heading.closest('.c'):null;minorLegal=document.getElementById('minorBlock');watchLegal(adultLegal,'adult');watchLegal(minorLegal,'minor');mode();refreshAgreement()});</script>
