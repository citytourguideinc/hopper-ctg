<div class="c"><h2>Ride Information</h2><div class="r"><div class="f"><label>Ride Date</label><input id="ride_date" type="date" required></div><div class="f"><label>Start Time</label><input id="start_time" type="time" required></div></div><p style="font-size:12px;margin-bottom:0">Used to group signed waivers for the same ride.</p></div><div class="c"><h2>Participant Information</h2><div class="f"><label>Print Name</label><input id="name" autocomplete="name"></div><div class="r"><div class="f"><label>DOB</label><input id="dob" type="date"></div><div class="f"><label>Phone Number</label><input id="phone" type="tel" autocomplete="tel"></div></div><div class="f"><label>Address</label><input id="address" autocomplete="street-address"></div><div class="r"><div class="f"><label>City</label><input id="city" autocomplete="address-level2"></div><div class="f"><label>State</label><input id="state" autocomplete="address-level1"></div></div><div class="r"><div class="f"><label>Zip</label><input id="zip" autocomplete="postal-code"></div><div class="f"><label>Email</label><input id="email" type="email" autocomplete="email"></div></div><div id="minorFields" style="display:none"><h2>Parent / Legal Guardian and Minor Children</h2><p>Parent Name/Legal Guardian (Print): <span id="guardianMirror"></span></p><div id="children"></div></div><div class="f"><label>Signature of Participant / Parent or Legal Guardian</label><div class="sig"><canvas id="sig"></canvas></div><button type="button" onclick="clearSig()" style="margin-top:8px;padding:8px">Clear Signature</button></div><div class="f"><label><input id="confirm" type="checkbox" style="width:auto" disabled> <span id="confirmText">Scroll through the full release above to confirm you have read it.</span></label></div><div id="err" class="err"></div></div><div class="bar"><button id="submit" onclick="submitWaiver()">Submit Waiver</button></div></div>
